---
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/public_html/
    - /bin/cp index.html launcher.html platform-admin.html $DEPLOYPATH
    - /bin/cp deploy/.htaccess $DEPLOYPATH.htaccess
    - /bin/cp -R demo-img $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/hr $DEPLOYPATH/erp
    - /bin/cp -R apps/hr/. $DEPLOYPATH/hr/
    - /bin/cp -R apps/erp/. $DEPLOYPATH/erp/
