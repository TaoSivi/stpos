<!DOCTYPE html>
<html lang="lo">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ST POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Noto+Sans+Lao:wght@400;500;600;700;900&family=Noto+Serif+Lao:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--tiff:#0ABAB5;--tiff2:#13C7C1;--tiff-lite:#5FD9D2;--tiff-deep:#0A7E7A;--tiff-ink:#075A57;
 --grad:linear-gradient(135deg,#0ABAB5 0%,#16C6C0 55%,#5FD9D2 100%);--grad-deep:linear-gradient(135deg,#0A7E7A,#0ABAB5);
 --green:#16a34a;--pink:#ec4899;--orange:#f97316;--blue:#3b82f6;--red:#ef4444;--gold:#f4b740;
 --bg:#f3fbfb;--card:#fff;--line:#dbeeed;--text:#0f2e2c;--muted:#5b7d7b;--free:#16a34a;--busy:#f59e0b;--bill:#ef4444;--new:#ec4899;--merge:#0ABAB5;--callbill:#f97316;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans Lao','Roboto',system-ui,sans-serif}
body{background:var(--bg);color:var(--text);overflow:hidden}button{cursor:pointer;border:none;font-family:inherit}.hidden{display:none!important}
#app{display:flex;height:100vh;width:100vw}
#sidebar{width:236px;background:linear-gradient(180deg,#ffffff 0%,#f0fbfa 100%);border-right:1px solid var(--line);flex-shrink:0;display:flex;flex-direction:column;overflow:auto}
.brand{background:var(--grad);color:#fff;padding:16px 14px;display:flex;align-items:center;gap:11px}
.brand .logo{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
.brand b{font-size:20px;display:block;line-height:1;letter-spacing:.5px}.brand small{font-size:10px;opacity:.9}
.navsec{padding:13px 16px 4px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.navitem{display:flex;align-items:center;gap:11px;padding:11px 14px;color:var(--text);font-size:14px;background:none;width:auto;align-self:stretch;margin:3px 12px;border-radius:12px;text-align:left;font-weight:500;transition:.15s}
.navitem:hover{background:#e6f7f6}.navitem.active{background:var(--grad);color:#fff;font-weight:700;box-shadow:0 5px 14px rgba(10,186,181,.38)}.navitem.active .live{background:#fff;color:#ef4444}
.navitem .ic{font-size:17px}.live{margin-left:auto;background:#ef4444;color:#fff;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 1px 8px rgba(10,186,181,.06)}
.topbar h1{font-size:20px;font-weight:900;flex:1;text-align:center;background:var(--grad-deep);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ordno{background:var(--grad);color:#fff;min-width:42px;height:42px;padding:0 6px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
#viewRoot{flex:1;overflow:auto;display:flex;flex-direction:column;background:linear-gradient(135deg,#edf9f8 0%,#f7fdfc 42%,#e9f7f5 100%)}.pad{padding:18px}
.tv-head{display:flex;align-items:center;gap:12px;margin-bottom:13px;flex-wrap:wrap}.tv-head .ttl{font-size:22px;font-weight:900;background:var(--grad-deep);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.tv-head .sub{color:var(--muted);font-size:12px}
.toolbar>span:first-child{background:var(--grad-deep);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.floors{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{padding:7px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.chip.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(10,186,181,.3)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:8px;background:#fff;padding:12px 16px;border-radius:14px;box-shadow:0 2px 10px rgba(10,186,181,.06)}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}.dot{width:12px;height:12px;border-radius:50%}
.outstanding{background:linear-gradient(135deg,#fff7e6,#fef0c7);border:1px solid #f5d488;border-radius:14px;padding:12px 16px;margin-bottom:15px;font-size:14px;font-weight:700;color:#92710e}
.tablegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}
.tablecard{background:#fff;border-radius:16px;padding:15px 8px;text-align:center;border:2px solid var(--line);position:relative;transition:.14s;box-shadow:0 2px 8px rgba(10,186,181,.05)}
.tablecard:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(10,186,181,.18)}
.tablecard .tname{font-weight:800;font-size:16px;margin-top:2px}.tablecard .tseat{display:flex;align-items:center;justify-content:center;color:var(--free);opacity:.85}.tablecard .tamt{font-size:11px;color:var(--muted);margin-top:5px}
.freepill{display:inline-block;background:#e8f9f7;color:#0a7e7a;font-weight:700;font-size:11px;padding:3px 12px;border-radius:20px}
.s-busy .tseat{color:var(--busy)}.s-bill .tseat{color:var(--bill)}.s-new .tseat{color:var(--new)}.s-main .tseat{color:var(--tiff-deep)}.s-merged .tseat{color:var(--tiff-lite)}
.tablecard .qrbadge svg{color:#0a7e7a}.qrbadge:hover svg{color:#fff}
.s-free{border-color:var(--free)}.s-busy{border-color:var(--busy);background:#fffbeb}.s-bill{border-color:var(--bill);background:#fef2f2}.s-bill .tname{color:var(--bill)}
.s-new{border-color:var(--new);background:#fdf2f8}.s-main{border-color:var(--tiff);background:#eafbfa}.s-merged{border-color:var(--tiff-lite);opacity:.55}
.s-callbill{border-color:var(--callbill);background:#fff7ed}.s-callbill .tname{color:#c2410c}.s-callbill .tseat{color:var(--callbill)}
.calltag{position:absolute;top:6px;left:7px;background:var(--callbill);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;z-index:2;animation:callpulse 1.2s infinite}
@keyframes callpulse{0%,100%{opacity:1}50%{opacity:.45}}
.layoutbtns{display:inline-flex;gap:4px;background:#eafbfa;border:1px solid var(--line);border-radius:11px;padding:3px}
.layoutbtns button{border:none;background:transparent;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;color:var(--tiff-deep);cursor:pointer;font-family:inherit}
.layoutbtns button.on{background:var(--grad);color:#fff}
.planhint{font-size:12px;color:var(--tiff-deep);background:#eafbfa;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin-top:8px;text-align:center;font-weight:600}
.pvwrap{position:relative;width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(10,126,122,.09);overflow:hidden;margin-top:8px}
.pvsvg{display:block;width:100%;height:auto;aspect-ratio:5/3;user-select:none;-webkit-user-select:none}
.pvsvg.edit{touch-action:none}
.pvsvg.edit.tool-pen,.pvsvg.edit.tool-line,.pvsvg.edit.tool-curve,.pvsvg.edit.tool-rect,.pvsvg.edit.tool-ellipse{cursor:crosshair}
.pvsvg.edit.tool-text{cursor:text}
.pvsvg.edit.tool-select .ptbl{cursor:grab}
.pvsvg .ptn{font-weight:800;font-size:20px;fill:#0f172a;pointer-events:none;font-family:inherit}
.pvsvg .pts{font-size:13px;font-weight:700;pointer-events:none;font-family:inherit}
.pvsvg:not(.edit) .ptbl{cursor:pointer;transition:opacity .15s}
.pvsvg:not(.edit) .ptbl:hover{opacity:.82}
.pvsvg .picon{cursor:pointer}
.pvsvg .picon:hover circle{stroke:#0ABAB5;stroke-width:3}
.pvsvg text{font-family:"Phetsarath OT","Noto Sans Lao","Saysettha OT",sans-serif}
.ppulse{animation:callpulse 1.2s infinite}
.ptoolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:0 2px 12px rgba(10,126,122,.06);margin-top:4px}
.ptoolbar .tb{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:#f1faf9;color:#0f766e;padding:8px 12px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;min-height:40px;transition:.12s}
.ptoolbar .tb:hover{background:#dff4f2}
.ptoolbar .tb.on{background:var(--grad);color:#fff;box-shadow:0 3px 10px rgba(10,186,181,.32)}
.ptoolbar .tb .ti{font-size:16px;line-height:1;min-width:14px;text-align:center}
.ptoolbar .sep{width:1px;height:28px;background:var(--line);margin:0 4px}
.pprops{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:8px;padding:8px 12px;background:#f8fdfc;border:1px dashed #b7e4df;border-radius:12px;font-size:13px;min-height:46px}
.pprops .pl{color:var(--muted)}
.pprops .sw{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #cbd5e1;cursor:pointer;display:inline-block}
.pprops .sw.on{box-shadow:0 0 0 2px #0f766e}
.pprops .pb{border:1px solid var(--line);background:#fff;padding:6px 11px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit;font-size:13px;color:var(--text);min-height:34px}
.pprops .pb:hover{border-color:var(--tiff)}
.pprops .pb.on{background:#0f766e;color:#fff;border-color:#0f766e}
.pprops .pb.red{color:#dc2626}
.ingimg{display:inline-flex;align-items:center;justify-content:center;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff;vertical-align:middle;position:relative;overflow:hidden}
.ingimg.ph{background:linear-gradient(135deg,#e6f7f6,#f5fbfb);color:#0A7E7A;font-weight:800}
.ingimg .cam{position:absolute;right:1px;bottom:0;font-size:11px;line-height:1;color:#0A7E7A;opacity:.8}
.qrbadge{position:absolute;top:6px;right:7px;background:#dff7f5;border-radius:9px;width:29px;height:29px;display:flex;align-items:center;justify-content:center;z-index:2;transition:.12s}.qrbadge:hover{background:var(--tiff);transform:scale(1.12)}
#orderWrap{flex:1;display:flex;overflow:hidden}.menupane{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:13px}
.cats{display:flex;gap:7px;margin-bottom:9px;flex-wrap:wrap}.cat{padding:8px 17px;border-radius:11px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}
.cat.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(10,186,181,.3)}
.subcats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px;align-items:center}.subcat{padding:5px 12px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:12px;font-weight:600}
.subcat.active{background:var(--tiff-deep);color:#fff;border-color:transparent}
.dttoggle{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.dttoggle button{padding:6px 13px;font-size:12px;font-weight:700;background:#fff}.dttoggle button.on{background:var(--tiff);color:#fff}
.searchbox input{padding:7px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;width:150px;margin-left:8px}
.products{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(125px,1fr));gap:8px;align-content:start}
.product{background:#fff;border-radius:10px;border:1px solid var(--line);position:relative;transition:.14s;box-shadow:0 1px 5px rgba(10,186,181,.05);padding:8px;display:flex;flex-direction:column;gap:5px;cursor:pointer;min-height:58px}
.product:hover{transform:translateY(-3px);box-shadow:0 10px 20px rgba(10,186,181,.16)}
.product .thumb{aspect-ratio:1;width:100%;border-radius:8px;background:linear-gradient(135deg,#d5f6f4,#eafbfa);overflow:hidden;display:flex;align-items:center;justify-content:center}
.product .thumb img{width:100%;height:100%;object-fit:contain}
.product .pname{font-size:12px;font-weight:700;line-height:1.25;color:var(--text);flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product .ptop{display:flex;align-items:center;justify-content:space-between;gap:6px}
.product .price{background:var(--grad);color:#fff;font-size:12px;font-weight:800;padding:2px 8px;border-radius:8px;white-space:nowrap}
.product .code{font-size:10px;color:var(--muted);font-weight:600}
.product.lowstk{outline:2px solid var(--red)}
.cart{width:372px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column}
.cart-top{background:var(--grad);padding:12px;display:flex;gap:9px}.cart-top button{flex:1;padding:11px;border-radius:11px;font-weight:700;font-size:13px;background:rgba(255,255,255,.25);color:#fff}
.cart-items{flex:1;overflow:auto;padding:8px 12px}.citem{border-bottom:1px solid var(--line);padding:9px 0;display:flex;gap:8px}
.citem .ci-main{flex:1}.citem .ci-name{font-size:13px;font-weight:700}.citem .ci-mod{font-size:11px;color:var(--pink);margin-top:2px}
.citem .ci-ctrls{display:flex;align-items:center;gap:7px;margin-top:5px}.qbtn{width:25px;height:25px;border-radius:50%;background:#eafbfa;font-size:15px;font-weight:700;color:var(--tiff-deep)}.qbtn:hover{background:#cdefed}
.miniic{background:none;font-size:14px}.citem .ci-right{text-align:right;font-weight:800;font-size:13px}.trash{color:#ef4444;background:none;font-size:15px}
.cart-empty{text-align:center;color:var(--muted);padding:38px 0;font-size:14px}.cart-foot{border-top:1px solid var(--line);padding:12px}
.totrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:3px 0}.totrow.grand{font-size:20px;font-weight:900;color:var(--text);margin-top:5px}
.lnk{color:var(--tiff-deep);font-weight:600;cursor:pointer;font-size:12px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.actions button{padding:11px;border-radius:11px;color:#fff;font-weight:700;font-size:13px}
.b-bill{background:var(--tiff-deep)}.b-pay{background:var(--green)}.b-split{background:var(--tiff)}.b-move{background:var(--pink)}.b-merge{background:var(--blue)}.b-cancel{background:var(--orange)}
.confirm{width:100%;padding:15px;border-radius:13px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;margin-top:8px;box-shadow:0 5px 16px rgba(10,186,181,.35)}
.overlay{position:fixed;inset:0;background:rgba(7,46,44,.45);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:18px;padding:22px;width:420px;max-width:92vw;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(7,46,44,.3)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:19px;margin-bottom:12px;text-align:center}.modal h3{font-size:14px;margin:12px 0 6px;color:var(--muted)}
.modal label{display:block;font-size:13px;margin:8px 0 3px;font-weight:600}.modal input,.modal select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.optrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}.opt{padding:7px 13px;border:1px solid var(--line);border-radius:20px;font-size:13px;background:#fff}.opt.sel{background:var(--tiff);color:#fff;border-color:transparent}
.modal-btns{display:flex;gap:10px;margin-top:16px}.modal-btns button{flex:1;padding:11px;border-radius:11px;font-weight:700;font-size:15px}
.btn-ok{background:var(--tiff);color:#fff}.btn-ok.grad{background:var(--grad)}.btn-cancel{background:#e7f3f2;color:var(--tiff-ink)}.btn-ok.green{background:var(--green)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.numpad button{padding:14px;font-size:16px;font-weight:700;background:#eafbfa;border-radius:11px;color:var(--tiff-deep)}
.paysummary{background:#f3fbfb;border-radius:12px;padding:12px;font-size:14px}.paysummary .row{display:flex;justify-content:space-between;margin:4px 0}.paysummary .change{font-size:18px;font-weight:900;color:var(--green)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f2e2c;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:80vw}
.tableselect{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;max-height:280px;overflow:auto}.tableselect .ts{padding:11px 4px;border:1px solid var(--line);border-radius:11px;text-align:center;font-weight:600;font-size:12px}
.ts.free{border-color:var(--free)}.ts.busy{background:#fffbeb;border-color:var(--busy)}
.paytype{display:flex;gap:7px;margin:9px 0;flex-wrap:wrap}.paytype .pt{flex:1;min-width:92px;padding:10px;border:1px solid var(--line);border-radius:11px;text-align:center;font-weight:600;font-size:12px}.paytype .pt.sel{background:var(--green);color:#fff;border-color:transparent}
.billline{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kds-head{display:flex;align-items:center;gap:12px;padding:13px 18px;background:var(--grad);color:#fff;flex-wrap:wrap}
.kds-head .stat{background:rgba(255,255,255,.2);border-radius:11px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer}.kds-head .stat.on{background:#fff;color:var(--tiff-deep)}
.kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;padding:16px}
.kcard{background:#fff;border-radius:14px;border-left:5px solid var(--busy);padding:13px;box-shadow:0 3px 12px rgba(10,186,181,.08)}
.kcard.st-wait{border-color:var(--muted)}.kcard.st-cooking{border-color:var(--orange)}.kcard.st-ready{border-color:var(--green)}
.kcard h4{font-size:15px;margin-bottom:4px}.kcard .meta{font-size:12px;color:var(--muted);margin-bottom:8px}.kcard .kbtn{width:100%;padding:9px;border-radius:9px;color:#fff;font-weight:700;font-size:13px;margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:50px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:18px}
.kpi{background:#fff;border-radius:18px;padding:18px;border:1px solid #ecf6f5;box-shadow:0 6px 20px rgba(10,186,181,.07);transition:.15s}.kpi:hover{box-shadow:0 10px 26px rgba(10,186,181,.13);transform:translateY(-2px)}.kpi .lbl{font-size:13px;color:var(--muted)}.kpi .val{font-size:26px;font-weight:900;margin-top:4px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}table.tbl th{background:var(--tiff-deep);color:#fff;padding:9px;text-align:left;position:sticky;top:0}table.tbl td{padding:8px 9px;border-bottom:1px solid var(--line)}table.tbl tr:hover{background:#f3fbfb}
.tag{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}.tag.ok{background:#dcfce7;color:#166534}.tag.warn{background:#fee2e2;color:#991b1b}
.btn-sm{padding:5px 11px;border-radius:8px;background:var(--tiff);color:#fff;font-size:12px;font-weight:700}.btn-sm.red{background:var(--red)}
.toolbar{display:flex;gap:8px;padding:14px 18px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;background:#eafbfa;border:1px solid var(--line);border-radius:20px;padding:5px 8px 5px 13px;font-size:13px;font-weight:600;margin:3px}
.pill button{background:var(--red);color:#fff;width:20px;height:20px;border-radius:50%;font-size:12px;line-height:1}
.modal.success{text-align:center;width:330px}.checkwrap{width:84px;height:84px;margin:4px auto 12px;border-radius:50%;background:#eafbfa;display:flex;align-items:center;justify-content:center}.checkwrap svg{width:60px;height:60px}
.checkwrap circle{fill:none;stroke:var(--tiff);stroke-width:3;stroke-dasharray:151;stroke-dashoffset:151;animation:dash .5s ease forwards}
.checkwrap path{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:48;stroke-dashoffset:48;animation:dash .4s .35s ease forwards}
@keyframes dash{to{stroke-dashoffset:0}}.modal.success h2{color:var(--tiff-deep)}.ssub{color:var(--muted);font-size:14px;margin-top:-4px}
.bootscreen{position:fixed;inset:0;background:var(--grad);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:500;gap:14px}.bootscreen .lg{font-size:46px;font-weight:900;letter-spacing:1px}

#sidebar{background:transparent!important;border-right:none!important;padding:14px 0 14px 14px;width:252px}
#sidebar>*{position:relative}
#sidebar::before{content:'';position:absolute;inset:14px 0 14px 14px;background:#062f2d;border-radius:26px;z-index:0}
@media (min-width:901px){#sidebar{position:relative}}
#sidebar .brand{background:transparent!important;padding:22px 18px 14px;box-shadow:none}
#sidebar .brand .logo{background:#0ABAB5!important;color:#062f2d;border-radius:14px!important;border:none!important;box-shadow:none!important;font-family:inherit!important;font-weight:800;width:42px;height:42px;font-size:16px}
#sidebar .brand b{font-family:inherit;font-weight:800;font-size:17px;letter-spacing:-.2px;color:#fff}
#sidebar .brand small{color:#7fbdb9;text-transform:none;letter-spacing:0;font-size:11px}
#sidebar .navsec{color:#6fb3ae!important;padding:14px 26px 4px}
#sidebar .navitem{color:#cdebe8!important;background:transparent;margin:2px 12px 2px 24px;border-radius:14px;height:44px;padding:0 12px;box-shadow:none}
#sidebar .navitem:hover{background:rgba(255,255,255,.07)!important}
#sidebar .navitem.active{background:#5FD9D2!important;color:#062f2d!important;font-weight:700;box-shadow:none!important}
#sidebar .navitem.active::before{display:none}
#sidebar .navitem .live{background:#f4b740;color:#3b2600}
#sidebar .navitem.active .live{background:#062f2d;color:#7ff0e9}
/* ແຖບເທິງ */
.topbar{background:transparent!important;border-bottom:none!important;box-shadow:none!important;padding:18px 26px 6px}
.topbar h1{font-family:inherit!important;font-size:26px!important;font-weight:800!important;letter-spacing:-.6px;color:var(--ink)!important;text-align:left}
.tb-date{font-size:13px;color:var(--muted)}
.tb-hi{color:var(--ink)}
.ordno{background:#062f2d!important;color:#7ff0e9;border-radius:16px!important;box-shadow:none!important}
#userChip>*{background:#fff;border:none;box-shadow:none}
/* ບັດ */
.kpi,.legend,.outstanding,.adminbox .asec,table.tbl,.kcard{border:none!important;border-radius:var(--r-lg)!important;box-shadow:var(--sh-1)}
.kpi::before{display:none}
.kpi .val{font-family:inherit!important;font-weight:800;letter-spacing:-1px}
.dashcards .kpi:first-child{background:#062f2d!important;box-shadow:0 18px 40px rgba(6,47,45,.25)!important}
.dashcards .kpi:first-child .val{color:#fff;font-size:clamp(28px,2.8vw,44px)!important;letter-spacing:-1.5px}
.dashcards .kpi:first-child .lbl,.dashcards .kpi:first-child .sub{color:#9fd8d4}
.dashcards .kpi:first-child::before{display:block}
.tv-head .ttl{font-family:inherit!important;font-size:26px!important;letter-spacing:-.6px;color:var(--ink)}
.modal h2{font-family:inherit!important;font-weight:800;letter-spacing:-.3px}
.modal{border-radius:28px!important}
table.tbl th{background:#f2f9f8!important;color:var(--muted)!important}
/* ປຸ່ມ */
.btn-ok,.grad,.btn-sm{background:#0A7E7A;border-radius:14px}
.btn-sm{border-radius:12px;box-shadow:none}
.chip,.cat,.subcat{border:none!important;background:#fff;box-shadow:none!important;border-radius:22px}
.chip.active,.cat.active,.subcat.active,.setnav button.on{background:#062f2d!important;color:#fff!important}
.layoutbtns{background:#fff;border:none;border-radius:14px}
.layoutbtns button.on{background:#062f2d;color:#fff}
/* ໂຕະ */
.tablegrid{gap:14px!important}
.tablecard{border-radius:22px!important;border:3px solid transparent!important;background:#fff;box-shadow:var(--sh-1)!important;text-align:left;padding:14px 16px!important;min-height:118px;display:flex;flex-direction:column}
.tablecard .tseat{display:none!important}
.tablecard .tname{font-size:24px!important;font-weight:800;letter-spacing:-.5px;margin-top:0;color:inherit}
.tablecard .tamt{margin-top:auto;font-size:15px}
.tablecard .tamt b{color:inherit!important;font-size:16px!important;font-weight:800}
.tablecard.s-free{background:#fff;border:2px dashed #cde3e1!important;box-shadow:none!important}
.tablecard.s-busy{background:#0ABAB5!important;color:#062f2d}
.tablecard.s-callbill,.tablecard.s-bill{background:#f4b740!important;color:#3b2600}
.tablecard.s-new{background:#062f2d!important;color:#fff}
.tablecard.s-new .tamt b{color:#7ff0e9!important}
.tablecard.s-main{background:#5FD9D2!important;color:#062f2d}
.tablecard:hover{transform:translateY(-3px);box-shadow:var(--sh-2)!important}
.tablecard .qrbadge{background:rgba(255,255,255,.6)!important;border-radius:11px}
.tablecard.s-new .qrbadge svg{color:#062f2d}
.tablecard .calltag{border-radius:12px}
.freepill{background:#eef5f4;color:var(--muted);border-radius:12px;padding:3px 10px;font-weight:700}
/* ໜ້າສັ່ງ */
.menupane{padding:10px 18px 16px 22px}
.products{gap:14px!important;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))!important}
.product{border:none!important;border-radius:22px!important;padding:8px!important;box-shadow:var(--sh-1)!important;background:#fff}
.product .thumb{border-radius:16px!important;background:#eef5f4}
.product .thumb img{object-fit:cover!important}
.product .pname{font-size:14px!important;font-weight:700;padding:4px 4px 0}
.product .ptop{padding:0 4px 2px}
.product .price{background:transparent!important;color:#0A7E7A!important;font-size:14px!important;font-weight:800;padding:0!important}
.product:hover{transform:translateY(-3px);box-shadow:var(--sh-2)!important}
.cart{background:#fff;border-left:none!important;border-radius:28px 0 0 28px;box-shadow:-10px 0 30px rgba(6,47,45,.06)!important;overflow:hidden}
.cart-top{background:#fff!important;padding:18px 18px 8px!important}
.cart-top button{background:#062f2d!important;color:#fff!important;border-radius:16px!important;height:48px;font-size:15px!important}
.cart-top button+button{background:#eef5f4!important;color:var(--ink)!important}
.cart-items{padding:6px 18px!important}
.citem{border-bottom:1px solid #eef5f4!important;padding:12px 0!important}
.citem .ci-name{font-size:14.5px!important}
.qbtn{border-radius:10px!important}
.cart-foot{border-top:none!important;background:#f5faf9;margin:0 12px 12px;border-radius:22px;padding:14px 16px!important}
.totrow.grand{font-size:22px!important;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.confirm{background:#0A7E7A!important;border-radius:18px!important;height:58px;font-size:17px!important;font-weight:800;font-family:inherit!important;box-shadow:none!important}
.actions button{border-radius:14px!important}
.actions .b-pay{background:#0A7E7A!important}
:root{--serif:'Plus Jakarta Sans','Noto Sans Lao',sans-serif}
.tablecard .qrbadge[title="ຈອງໂຕະ"]{left:auto!important;right:10px!important;top:auto!important;bottom:10px!important;background:rgba(255,255,255,.6)!important}
.tablecard .calltag{top:auto!important;bottom:12px!important;left:auto!important;right:12px!important;border-radius:12px!important}
.actions button{background:#eef5f4!important;color:#062f2d!important;font-weight:700}
.actions .b-bill{background:#062f2d!important;color:#fff!important}.actions .b-pay{background:#0A7E7A!important;color:#fff!important}
.actions .b-cancel{background:#fff1ee!important;color:#b4371f!important}
@media (max-width:900px){#sidebar{padding:10px 0 10px 10px}#sidebar::before{inset:10px 0 10px 10px}.topbar{padding:12px 14px 4px}.topbar h1{font-size:20px!important}.cart{border-radius:26px 26px 0 0}.products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important}.tablecard{min-height:100px}}
@media (max-width:900px){#bnav{left:12px!important;right:12px!important;bottom:12px!important;border-radius:24px;background:#062f2d!important;border-top:none!important;padding:8px 6px!important}#bnav button{color:#9fd8d4!important}#bnav button.on{color:#062f2d!important}#bnav button.on .bi{background:#5FD9D2!important}#bnav button.on{color:#7ff0e9!important}#bnav button.on .bi svg{color:#062f2d}#viewRoot{padding-bottom:96px}}

/* ===== ຮອບ 3 (Claude Design 2026-09-30) ===== */

function showBomViewer(){openModal('<h2> ສູດຕັດສະຕ໋ອກແຕ່ລະເມນູ</h2>'+
 '<input id="bomq" placeholder=" ຄົ້ນຫາເມນູ (ຊື່ ຫຼື ລະຫັດ)..." oninput="renderBomViewerList()" style="margin-bottom:8px">'+
 '<div id="bomvlist" style="max-height:48vh;overflow:auto"></div>'+
 '<div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">ປິດ</button><button class="btn-ok btn-exp" onclick="exportBOM()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg> Export ສູດ (Excel)</button><button class="btn-ok btn-exp" onclick="exportStockAll()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg> Export ສະຕ໋ອກ + ສູດ</button><button class="btn-ok grad" onclick="closeModal();openImportBOM()"> ນຳເຂົ້າສູດ</button></div>');renderBomViewerList();}
function exportBOM(){loadXLSX(function(err){if(err||!window.XLSX){toast('ໂຫຼດ Excel ບໍ່ໄດ້');return;}
 var rows=[['ລະຫັດເມນູ','ລະຫັດສະຕ໋ອກ','ຈຳນວນຕັດ','ຫົວໜ່ວຍ','ຊື່ເມນູ','ຊື່ວັດຖຸດິບ']];
 allMenu().forEach(function(p){if(p.bom&&p.bom.length){p.bom.forEach(function(b){var ing=state.ingredients[b[0]]||{};rows.push([p.c,b[0],b[1],ing.unit||'',p.n,ing.name||'']);});}else{rows.push([p.c,'','','',p.n,'(ບໍ່ມີສູດ)']);}});
 var ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'ສູດຕັດສະຕ໋ອກ');
 XLSX.writeFile(wb,'ສູດຕັດສະຕ໋ອກ_'+ymd(Date.now())+'.xlsx');toast('Export ສຳເລັດ — ແກ້ແລ້ວນຳເຂົ້າຄືນໄດ້ເລີຍ');});}
function exportStockAll(){loadXLSX(function(err){if(err||!window.XLSX){toast('ໂຫຼດ Excel ບໍ່ໄດ້');return;}
 var locs=(state.locations||[]),loc=(typeof stockViewLoc!=='undefined'&&stockViewLoc)||curLoc();
 var rows=Object.values(state.ingredients||{}).map(function(i){var sv=stockAt(i.code,loc),r={'ລະຫັດ':i.code,'ຊື່':i.name,'ປະເພດ':i.cat||'ວັດຖຸດິບ','ຫົວໜ່ວຍ':i.unit};
  if(locs.length>1)locs.forEach(function(l){r['ຄົງເຫຼືອ · '+l.name]=stockAt(i.code,l.id);});else r['ຄົງເຫຼືອ']=sv;
  r['ຈຸດສັ່ງຊື້']=i.reorder||0;r['ຕົ້ນທຶນ/ໜ່ວຍ']=i.cost||0;r['ມູນຄ່າຄົງເຫຼືອ']=Math.round(sv*(i.cost||0));r['ສະຖານະ']=sv<=(i.reorder||0)?'ຕ້ອງສັ່ງຊື້':'ປົກກະຕິ';return r;});
 var bom=[];allMenu().forEach(function(p){var b=p.bom||[];if(!b.length){bom.push({'ລະຫັດເມນູ':p.c,'ຊື່ເມນູ':p.n,'ລາຄາຂາຍ':p.p||0,'ລະຫັດວັດຖຸດິບ':'','ຊື່ວັດຖຸດິບ':'(ບໍ່ມີສູດ)','ຈຳນວນຕັດ':'','ຫົວໜ່ວຍ':'','ຕົ້ນທຶນ':''});return;}
  b.forEach(function(x){var ing=state.ingredients[x[0]]||{};bom.push({'ລະຫັດເມນູ':p.c,'ຊື່ເມນູ':p.n,'ລາຄາຂາຍ':p.p||0,'ລະຫັດວັດຖຸດິບ':x[0],'ຊື່ວັດຖຸດິບ':ing.name||'','ຈຳນວນຕັດ':x[1],'ຫົວໜ່ວຍ':ing.unit||'','ຕົ້ນທຶນ':Math.round((ing.cost||0)*x[1])});});});
 if(!rows.length&&!bom.length){toast('ບໍ່ມີຂໍ້ມູນ');return;}
 var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{'ໝາຍເຫດ':'ຍັງບໍ່ມີວັດຖຸດິບ'}]),'ສະຕ໋ອກ');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bom.length?bom:[{'ໝາຍເຫດ':'ຍັງບໍ່ມີເມນູ'}]),'ສູດອາຫານ');
 XLSX.writeFile(wb,'ສະຕ໋ອກ-ສູດ_'+ymd(Date.now())+'.xlsx');toast('Export ສຳເລັດ (2 ແຜ່ນ: ສະຕ໋ອກ + ສູດອາຫານ)');});}
function exportReport(){if(reportTab==='cancel')return exportCancel();if(reportTab==='loss')return exportLoss();if(reportTab==='product'&&typeof exportProduct==='function')return exportProduct();
 loadXLSX(function(err){if(err||!window.XLSX){toast('ໂຫຼດ Excel ບໍ່ໄດ້');return;}var body=document.getElementById('repbody');if(!body){toast('ບໍ່ມີຂໍ້ມູນ');return;}
  var wb=XLSX.utils.book_new(),n=0;
  var kp=[].slice.call(body.querySelectorAll('.kpi')).map(function(k){var l=k.querySelector('.lbl'),v=k.querySelector('.val');return l&&v?{'ຫົວຂໍ້':l.textContent.trim(),'ຄ່າ':v.textContent.trim()}:null;}).filter(Boolean);
  if(kp.length){XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(kp),'ສະຫຼຸບ');n++;}
  [].slice.call(body.querySelectorAll('table')).forEach(function(t,i){var c=t.cloneNode(true);[].slice.call(c.querySelectorAll('button,svg')).forEach(function(b){b.remove();});XLSX.utils.book_append_sheet(wb,XLSX.utils.table_to_sheet(c),'ຕາຕະລາງ '+(i+1));n++;});
  if(!n){toast('ໜ້ານີ້ບໍ່ມີຕາຕະລາງໃຫ້ export');return;}
  var on=document.querySelector('.setnav button.on'),tl=(on?on.textContent:reportTab).replace(/[\\\/?*\[\]:]/g,'').trim();
  XLSX.writeFile(wb,'ລາຍງານ_'+tl+'_'+(repDate||'ທັງໝົດ')+'.xlsx');toast('Export ສຳເລັດ');});}
function bomEditable_(){return can('menuEdit')&&state.catalog&&Object.keys(state.catalog).length>0;}
function setBomQty(code,idx,val){if(!bomEditable_())return;var p=findMenu(code);if(!p||!p.bom||!p.bom[idx])return;
 var v=+val;if(!(v>0)){toast('ຈຳນວນຕ້ອງ > 0');showMenuBom(code);return;}
 var old=p.bom[idx][1];p.bom[idx][1]=v;logOrder('ແກ້ໄຂສູດ',p.n+': '+p.bom[idx][0]+' '+old+' → '+v,'');save();showMenuBom(code);}
function delBomLine(code,idx){if(!bomEditable_())return;var p=findMenu(code);if(!p||!p.bom||!p.bom[idx])return;
 var rm=p.bom[idx];p.bom.splice(idx,1);logOrder('ແກ້ໄຂສູດ',p.n+': ລຶບ '+rm[0]+' ('+rm[1]+')','');save();showMenuBom(code);}
function addBomLine(code){if(!bomEditable_())return;var p=findMenu(code);if(!p)return;
 var ic=((document.getElementById('bom_nc')||{}).value||'').trim().toUpperCase();var q=+((document.getElementById('bom_nq')||{}).value||0);
 if(!ic||!state.ingredients[ic]){toast('ເລືອກລະຫັດວັດຖຸດິບຈາກລາຍການ');return;}
 if(!(q>0)){toast('ໃສ່ຈຳນວນຕັດ > 0');return;}
 if(!p.bom)p.bom=[];if(p.bom.some(function(b){return b[0]===ic;})){toast(ic+' ມີໃນສູດແລ້ວ — ແກ້ຈຳນວນແທນ');return;}
 p.bom.push([ic,q]);logOrder('ແກ້ໄຂສູດ',p.n+': ເພີ່ມ '+ic+' ('+q+' '+(state.ingredients[ic].unit||'')+')','');save();showMenuBom(code);}
function renderBomViewerList(){var q=((document.getElementById('bomq')||{}).value||'').toLowerCase();
 var list=allMenu().filter(function(p){return !q||p.n.toLowerCase().indexOf(q)>=0||p.c.toLowerCase().indexOf(q)>=0;});
 var el=document.getElementById('bomvlist');if(!el)return;
 el.innerHTML='<table class="tbl"><thead><tr><th>ເມນູ</th><th>ຕັດ</th><th></th></tr></thead><tbody>'+
  (list.slice(0,50).map(function(p){var n=(p.bom||[]).length;return '<tr><td>'+cesc(p.n)+'<br><small style="color:var(--muted)">'+cesc(p.c)+' · '+KIP(p.p)+' ກີບ</small></td><td>'+(n?('<b style="color:var(--tiff-deep)">'+n+'</b> ລາຍການ'):'<span class="tag warn">ບໍ່ມີສູດ</span>')+'</td><td><button class="btn-sm" onclick="showMenuBom(\''+p.c.replace(/'/g,"\\'")+'\')">ເບິ່ງ</button></td></tr>';}).join('')||'<tr><td colspan="3" style="text-align:center;padding:20px;color:#94a3b8">ບໍ່ພົບ</td></tr>')+
  '</tbody></table>'+(list.length>50?'<p style="font-size:12px;color:var(--muted);text-align:center;margin-top:6px">ສະແດງ 50 ຈາກ '+list.length+' — ພິມຄົ້ນຫາເພື່ອຫາເມນູ</p>':'');}
function showMenuBom(code){var p=findMenu(code);if(!p){toast('ບໍ່ພົບເມນູ');return;}
 var edit=bomEditable_();var tot=0;var safe=String(code).replace(/'/g,"\\'");
 var rows=(p.bom||[]).map(function(b,idx){var ing=state.ingredients[b[0]];var cost=(ing&&ing.cost)?b[1]*ing.cost:0;tot+=cost;
  return '<tr><td><div style="display:flex;align-items:center;gap:8px">'+(ing?ingThumb(b[0],34):'')+'<div>'+(ing?cesc(ing.name):'<b style="color:var(--red)">'+cesc(b[0])+' (ບໍ່ພົບ!)</b>')+'<br><small style="color:var(--muted)">'+cesc(b[0])+'</small></div></div></td>'+
   '<td style="font-weight:700;white-space:nowrap">'+(edit?('<input type="number" inputmode="decimal" value="'+b[1]+'" style="width:74px;padding:6px;text-align:center" onchange="setBomQty(\''+safe+'\','+idx+',this.value)"> '+(ing?cesc(ing.unit):'')):(KIP(b[1])+' '+(ing?cesc(ing.unit):'')))+'</td>'+
   '<td>'+(ing?KIP(ing.stock)+' '+cesc(ing.unit):'-')+'</td>'+
   '<td>'+(cost?KIP(cost):'<span style="color:#94a3b8">-</span>')+(edit?' <button class="trash" style="margin-left:6px" title="ລຶບແຖວ" onclick="delBomLine(\''+safe+'\','+idx+')">✕</button>':'')+'</td></tr>';}).join('');
 var addRow=edit?('<div style="display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap"><input id="bom_nc" list="ingdl" placeholder="ລະຫັດວັດຖຸດິບ (ພິມເພື່ອຄົ້ນ)" style="flex:2;min-width:150px"><input id="bom_nq" type="number" inputmode="decimal" placeholder="ຈຳນວນ" style="flex:1;min-width:70px"><button class="btn-sm green" onclick="addBomLine(\''+safe+'\')"> ເພີ່ມ</button></div>'+
  '<datalist id="ingdl">'+Object.values(state.ingredients).map(function(i){return '<option value="'+cesc(i.code)+'">'+cesc(i.name)+' ('+cesc(i.unit)+')</option>';}).join('')+'</datalist>'):'';
 openModal('<h2>'+cesc(p.n)+'</h2><p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px">'+cesc(p.c)+' · ລາຄາຂາຍ '+KIP(p.p)+' ກີບ · ຂາຍ 1 ອັນ ຕັດຕາມນີ້:'+(edit?' <span class="tag ok">ແກ້ໄຂໄດ້ — ບັນທຶກອັດຕະໂນມັດ</span>':'')+'</p>'+
  ((p.bom||[]).length?('<div style="max-height:42vh;overflow:auto"><table class="tbl"><thead><tr><th>ວັດຖຸດິບ</th><th>ຕັດ/ອັນ</th><th>ຄົງເຫຼືອ</th><th>ຕົ້ນທຶນ</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div class="paysummary" style="margin-top:8px"><div class="row"><span>ຕົ້ນທຶນລວມ (COGS):</span><b>'+KIP(tot)+' ກີບ</b></div><div class="row"><span>ກຳໄລຂັ້ນຕົ້ນ/ອັນ:</span><b style="color:'+((p.p-tot)>=0?'var(--green)':'var(--red)')+'">'+KIP(p.p-tot)+' ກີບ'+(p.p?' ('+((p.p-tot)/p.p*100).toFixed(0)+'%)':'')+'</b></div></div>'):
   '<div class="empty" style="padding:24px"> ເມນູນີ້ບໍ່ມີສູດ — ຂາຍແລ້ວຈະບໍ່ຕັດສະຕ໋ອກ'+(edit?'<br><small>ເພີ່ມວັດຖຸດິບຂ້າງລຸ່ມນີ້ໄດ້ເລີຍ</small>':'')+'</div>')+
  addRow+
  (edit?'':(can('menuEdit')?'<p style="font-size:12px;color:var(--muted);text-align:center;margin-top:8px">ແກ້ໄຂໄດ້ຫຼັງນຳເຂົ້າເມນູຈາກ Excel ແລ້ວ</p>':'<p style="font-size:12px;color:var(--muted);text-align:center;margin-top:8px">ແກ້ໄຂສູດໄດ້ສະເພາະ ຜູ້ຈັດການ/ເຈົ້າຂອງ</p>'))+
  '<div class="modal-btns"><button class="btn-cancel" onclick="showBomViewer()">‹ ກັບ</button><button class="btn-ok" onclick="closeModal()">ປິດ</button></div>');}
function addStock(code){if(!can('stockAdjust')){toast('ບໍ່ມີສິດຮັບສະຕ໋ອກ');return;}const it=state.ingredients[code];openModal(`<h2>ຮັບສະຕ໋ອກເຂົ້າ — ${it.name}</h2><p style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:4px">ເຂົ້າບ່ອນເກັບ: <b>${cesc(locName(stockViewLoc))}</b></p><label>ຈຳນວນ (${it.unit})</label><input id="qty" type="number" value="1000"><label style="margin-top:8px">ມູນຄ່າທີ່ຊື້ (ກີບ) — ບັນທຶກເປັນລາຍຈ່າຍ ${EXP_CATS[0]} (0 = ບໍ່ບັນທຶກ)</label><input id="qcost" type="number" value="0"><div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">ຍົກເລີກ</button><button class="btn-ok green" onclick="doAddStock('${code}')">ຮັບເຂົ້າ</button></div>`);}
function doAddStock(code){const q=+document.getElementById('qty').value||0;const cost=+(document.getElementById('qcost')||{}).value||0;const it=state.ingredients[code];if(!stockViewLoc)stockViewLoc=curLoc();addStockAt(code,stockViewLoc,q,'ຮັບເຂົ້າ',(cost>0?'ມູນຄ່າ '+KIP(cost)+' ກີບ ':'')+'['+locName(stockViewLoc)+']');
 if(cost>0&&q>0)it.cost=Math.round((cost/q)*100)/100;
 if(cost>0){if(!Array.isArray(state.expenses))state.expenses=[];state.expenses.push({id:Date.now()+Math.random(),ts:Date.now(),cat:EXP_CATS[0],note:'ຊື້ '+it.name+' '+KIP(q)+' '+it.unit,amount:cost,by:whoBy()});}
 save();closeModal();render();showSuccess('ຮັບສະຕ໋ອກສຳເລັດ!',it.name+' +'+KIP(q)+' '+it.unit+(cost>0?'  ບັນທຶກລາຍຈ່າຍ '+KIP(cost)+' ກີບ':''));}
function addIngredient(){if(!can('stockAdjust')){toast('ບໍ່ມີສິດ');return;}openModal(`<h2> ເພີ່ມວັດຖຸດິບໃໝ່</h2><label>ລະຫັດ (ຫ້າມຊ້ຳ)</label><input id="ic" placeholder="ເຊັ່ນ HONEY"><label>ຊື່</label><input id="inm" placeholder="ນ້ຳເຜິ້ງ"><label>ຫົວໜ່ວຍ</label><input id="iu" value="g"><label>ສະຕ໋ອກເລີ່ມຕົ້ນ</label><input id="ist" type="number" value="1000"><label>ຈຸດສັ່ງຊື້</label><input id="ir" type="number" value="200"><div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">ຍົກເລີກ</button><button class="btn-ok green" onclick="doAddIngredient()">ເພີ່ມ</button></div>`);}
function doAddIngredient(){const c=(document.getElementById('ic').value||'').trim().toUpperCase();if(!c){toast('ໃສ່ລະຫັດ');return;}if(state.ingredients[c]){toast('ລະຫັດຊ້ຳ');return;}
 var init=+document.getElementById('ist').value||0;var lc=stockViewLoc||curLoc();
 state.ingredients[c]={code:c,name:document.getElementById('inm').value||c,unit:document.getElementById('iu').value||'g',reorder:+document.getElementById('ir').value||0,locs:(init?{[lc]:init}:{})};
 if(init)logStock(c,init,'ເພີ່ມວັດຖຸດິບ','ເລີ່ມຕົ້ນ ['+locName(lc)+']',lc);
 save();closeModal();render();showSuccess('ເພີ່ມວັດຖຸດິບສຳເລັດ!',c);}
function resetStockAll(){if(!can('stockAdjust')){toast('ບໍ່ມີສິດ');return;}if(!confirm('ຕັ້ງສະຕ໋ອກໃໝ່ຂອງ "'+locName(stockViewLoc)+'" ທັງໝົດ?'))return;Object.values(state.ingredients).forEach(i=>{setStockAt(i.code,stockViewLoc,(/^(g|ml|kg|l)$/i.test(i.unit||''))?100000:1000,'ຕັ້ງສະຕ໋ອກໃໝ່','['+locName(stockViewLoc)+']');});save();render();toast('ຕັ້ງສະຕ໋ອກໃໝ່ແລ້ວ ('+locName(stockViewLoc)+')');}
/* ===== THEME v7: icons, drawer, bottom nav, clock ===== */

  draw();if(imgs.length>1)_cdsImgT=setInterval(function(){idx=(idx+1)%imgs.length;draw();},Math.max(2,+c.imgSec||6)*1000);
  return;}
 el.innerHTML=cdsHead(m)+'<div class="cds-idle"><div class="big">'+cesc(c.welcome||'ຍິນດີຕ້ອນຮັບ')+'</div><div class="sub">'+cesc(c.welcomeSub||'Welcome')+'</div>'+(c.showPromo!==false?cdsPromoBadge(m):'')+'</div>';}

 el.innerHTML='<div class="cds-thanks"><div class="big"> '+cesc(c.thanks||'ຂອບໃຈ')+'</div><div class="sub">'+cesc(c.thanksSub||'Thank you')+'</div>'+((m.change>0)?'<div class="sub" style="margin-top:10px">ເງິນທອນ '+KIP(m.change)+' ກີບ</div>':'')+'</div>';
 clearTimeout(window.__cdsT);window.__cdsT=setTimeout(function(){cdsIdle(m);},5000);}
