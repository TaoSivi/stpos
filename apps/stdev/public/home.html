<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2f2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LTG Track">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>LTG Track — ໜ້າຫຼັກ</title>
<link rel="stylesheet" href="fuel.css?v=119">
<style>
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,var(--dark),var(--dark-2));color:#fff;border-radius:var(--r);padding:18px 20px;margin:0 0 22px;box-shadow:var(--sh-2);animation:riseIn .4s both}
.hello small{display:block;opacity:.75;font-size:14px}.hello b{font-size:22px;display:block;margin-top:2px}.hello .chip{background:rgba(255,255,255,.14);color:#fff;border:0;white-space:nowrap}
.search{width:100%;margin:0 0 18px;padding:14px 16px;border:1px solid var(--line-2);border-radius:14px;font-size:16px;background:var(--card)}
.cat{margin:0 0 6px}.cat-h{font-size:15px;font-weight:700;margin:0 4px 10px;color:var(--ink);display:flex;align-items:baseline;gap:10px;letter-spacing:.2px}.cat-h small{font-weight:400;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin:0 0 20px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.tile[data-cat=admin] .logo{background:linear-gradient(135deg,var(--dark-2),var(--dark));box-shadow:0 6px 16px rgba(11,47,45,.35)}
.tile[data-cat=docs] .logo{background:linear-gradient(135deg,#f3b24a,#d9822b);box-shadow:0 6px 16px rgba(217,130,43,.35)}
.tile{display:flex;align-items:center;gap:16px;width:100%;text-align:left;border:0;background:var(--card);border-radius:var(--r);padding:20px;margin:0;box-shadow:var(--sh-1);animation:riseIn .45s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s,box-shadow .2s}
.tile:active{transform:scale(.98)}.tile:hover{box-shadow:var(--sh-2)}
.tile .logo{width:58px;height:58px;border-radius:20px;flex:0 0 58px}.tile .logo svg{width:30px;height:30px;stroke:#fff}
.tile b{font-size:18px;display:block}.tile span.muted{font-size:14px}
</style>
</head>
<body>
<div id="hd"></div>
<main style="max-width:760px"><div id="v"><div class="skel"></div><div class="skel"></div></div><div id="inst"></div></main>
<script src="app.js?v=119"></script>
<script src="offline.js?v=119"></script>
<script src="home.js?v=119"></script>
</body>
</html>
