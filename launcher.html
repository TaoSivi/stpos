<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ST Platform — ເຂົ້າແອັບຂອງບໍລິສັດ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Noto+Sans+Lao:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--tiff:#0ABAB5;--tiff-deep:#0A7E7A;--bg:#eaf4f3;--card:#fff;--line:#e1efed;--ink:#062f2d;--muted:#4d7471;--ok:#15803d;--err:#c2410c;--r-lg:24px;
 --sh-1:0 1px 2px rgba(6,47,45,.04),0 8px 24px rgba(6,47,45,.05);--sh-2:0 16px 36px rgba(6,47,45,.12);--sh-pri:0 6px 16px rgba(10,126,122,.26);--grad:linear-gradient(135deg,#0A7E7A,#0ABAB5);--field:#f4faf9;--tile:#e3f6f4}
@media (prefers-color-scheme:dark){:root{--bg:#041d1b;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--ink:#EAF7F5;--muted:#9FC7C2;--ok:#7fe0a0;--err:#fb9a6a;--sh-1:0 8px 24px rgba(0,0,0,.28);--sh-2:0 12px 32px rgba(0,0,0,.4);--field:rgba(255,255,255,.06);--tile:rgba(10,186,181,.16);--tiff-deep:#BDF3EE}}
*{box-sizing:border-box;margin:0;font-family:'Noto Sans Lao','Roboto',system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;padding:24px 16px 40px;display:flex;justify-content:center}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:220px;background:linear-gradient(160deg,#063b39,#0a5a56);z-index:-1;border-radius:0 0 32px 32px}
@media (prefers-color-scheme:dark){body::before{background:linear-gradient(160deg,#031d1b,#07504b)}}
main{width:100%;max-width:600px;display:grid;gap:16px;align-content:start}
.brand{display:flex;align-items:center;gap:12px;color:#EAF7F5;padding:4px 2px 10px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--grad);display:grid;place-items:center;font-weight:900;font-size:17px;color:#fff;box-shadow:var(--sh-pri)}
.brand b{display:block;font-weight:700;font-size:21px;line-height:1.3}.brand span{font-size:13.5px;color:#BDF3EE}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-1)}
h2{font-size:17px;font-weight:700;margin-bottom:6px}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}small{color:var(--muted);font-size:13px;font-weight:400}
input:not([type=checkbox]){width:100%;min-height:48px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:17px}
input::placeholder{color:var(--muted);opacity:.8}
input:focus{outline:none;border-color:var(--tiff);box-shadow:0 0 0 4px rgba(10,186,181,.2)}
button:focus-visible,a:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid var(--tiff);outline-offset:2px}
button.p,button.g{min-height:48px;margin-top:16px;padding:12px 20px;border-radius:14px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;border:0;transition:transform .15s,box-shadow .15s}
button.p{width:100%;background:var(--grad);color:#fff;box-shadow:var(--sh-pri)}button.p:hover{transform:translateY(-1px)}button.p:active{transform:none}
button.g{background:var(--tile);color:var(--tiff-deep);border:1px solid var(--line)}button:disabled{opacity:.6;cursor:wait}
.err,.er{color:var(--err)}.ok{color:var(--ok)}.msg,.err{margin-top:12px;min-height:1.4em;white-space:pre-wrap;font-weight:600}
.hide{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.co{display:flex;justify-content:space-between;align-items:center;gap:12px}.co b{font-weight:700;font-size:20px;color:#EAF7F5}
.co button{min-height:44px;background:none;border:0;color:#BDF3EE;font:inherit;font-weight:700;cursor:pointer;padding:8px 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
a.app{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-height:144px;box-shadow:var(--sh-1);transition:transform .18s,box-shadow .18s,border-color .18s}
a.app:hover{transform:translateY(-2px);box-shadow:var(--sh-2);border-color:var(--tiff)}a.app:active{transform:none}
a.app .i{width:46px;height:46px;border-radius:14px;background:var(--tile);display:grid;place-items:center;color:var(--tiff-deep)}
a.app svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
a.app b{font-size:17px;font-weight:700}a.app span.d{color:var(--muted);font-size:13.5px}
select{width:100%;min-height:48px;padding:12px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);font-size:17px}
select:focus{outline:none;border-color:var(--tiff);box-shadow:0 0 0 4px rgba(10,186,181,.2)}
.lnk{background:none;border:0;color:var(--tiff-deep);font:inherit;font-weight:700;cursor:pointer;min-height:44px;padding:8px 4px;text-decoration:none;display:inline-block}
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.apps label{display:flex;gap:8px;align-items:center;min-height:44px;margin:0;padding:6px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--field);font-weight:600;font-size:14px;cursor:pointer}
.apps input{width:20px;height:20px;accent-color:#0A7E7A}.apps label:has(input:checked){border-color:var(--tiff);background:var(--tile)}
.srow{margin-top:12px}.srow .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.srow .top b{font-size:17px}
.srow .pinrow{display:flex;gap:8px;margin-top:10px}.srow .pinrow input{flex:1}.srow button.g{margin-top:10px}
.msg-ok{color:var(--ok)}
</style>
</head>
<body>
<main>
 <div class="brand"><div class="logo" aria-hidden="true">ST</div><div><b>ST Platform</b><span>ໃສ່ລະຫັດບໍລິສັດ ເພື່ອເຂົ້າແອັບຂອງບໍລິສັດທ່ານ</span></div></div>
 <section class="card" id="s1">
  <form id="f" autocomplete="off">
   <h2>ເຂົ້າສູ່ບໍລິສັດ</h2><label for="code">ລະຫັດບໍລິສັດ</label>
   <input id="code" inputmode="latin" autocapitalize="none" spellcheck="false" maxlength="32" placeholder="ຕົວຢ່າງ: clinic1" required>
   <button class="p" id="go" type="submit">ຕໍ່ໄປ</button>
   <div class="err" id="err" role="alert"></div>
  </form>
 </section>
 <p style="text-align:center"><button type="button" id="supbtn" class="lnk">Super admin — ເຂົ້າທຸກບໍລິສັດ →</button></p>
 <section class="card hide" id="sS">
  <form id="sf" autocomplete="off">
   <h2>Super admin</h2><label for="spin">PIN Super admin</label>
   <input id="spin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
   <button class="p" id="sgo" type="submit">ເຂົ້າລະບົບ</button>
   <div class="err" id="serr" role="alert"></div>
  </form>
  <p style="text-align:center;margin-top:10px"><a href="platform-admin.html" class="lnk">ໜ້າຜູ້ດູແລລະບົບ (ສ້າງ/ແກ້ໄຂບໍລິສັດ)</a></p>
 </section>
 <section class="hide" id="sM">
  <div class="co"><b>ພະນັກງານ · <span id="mco"></span></b><button type="button" id="mback">‹ ກັບໄປແອັບ</button></div>
  <div class="card">
   <h2>ເພີ່ມພະນັກງານ</h2>
   <label for="mn">ຊື່</label><input id="mn" type="text" maxlength="60">
   <label for="mp">PIN <small>(ຕົວເລກ 4-8 ຫຼັກ)</small></label><input id="mp" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password">
   <label>ເຂົ້າແອັບໄດ້</label><div class="apps" id="mapps"></div>
   <button class="p" id="madd" type="button">ເພີ່ມພະນັກງານ</button>
   <div class="err" id="merr" role="status"></div>
  </div>
  <div id="mlist"></div>
 </section>
 <section class="hide" id="sC">
  <div class="co"><b>ເລືອກບໍລິສັດ</b><button type="button" id="sout">ອອກຈາກ Super admin</button></div>
  <div class="grid" id="clist"></div>
  <div class="err" id="cerr" role="alert"></div>
 </section>
 <section class="card hide" id="sL">
  <form id="lf" autocomplete="off">
   <h2 id="lco">ເຂົ້າລະບົບ</h2>
   <label for="lu">ຊື່ຂອງເຈົ້າ</label><select id="lu"></select>
   <label for="lp">PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="••••">
   <button class="p" id="lgo" type="submit">ເຂົ້າລະບົບ</button>
   <div class="err" id="lerr" role="alert"></div>
  </form>
  <p style="text-align:center;margin-top:6px"><button type="button" class="lnk" id="lback">‹ ປ່ຽນບໍລິສັດ</button></p>
 </section>
 <section id="s2" class="hide">
  <div class="co"><b id="cn"></b><span><button type="button" id="mstaff" class="hide">ຈັດການພະນັກງານ</button> <button type="button" id="lout">ອອກຈາກລະບົບ</button> <button type="button" id="chg">ປ່ຽນບໍລິສັດ</button></span></div>
  <div class="err" id="aerr" role="alert" style="color:#fff"></div>
  <div class="grid" id="apps"></div>
 </section>
</main>
<script>
/* ແຄັດຕາລັອກແອັບ — ເພີ່ມແອັບໃໝ່ = ເພີ່ມ 1 ແຖວຢູ່ນີ້ ແລ້ວໃສ່ id ໃນລາຍຊື່ແອັບຂອງບໍລິສັດ (tenant_set)
   kind 'pos' = ເປີດ ST POS (index.html ຢູ່ຖັດກັນ) ເຊື່ອມ server ຂອງບໍລິສັດ · 'erp' = LaoBooks (ໃຊ້ endpoint /erp ຂອງບໍລິສັດ) · 'hr' = ST HR (ໃຊ້ endpoint /hr ຂອງບໍລິສັດ) */
var ERP_URL = location.origin + '/erp/'; /* ສຳເນົາໃນ apps/erp (deploy ຂຶ້ນ stdev.store/erp/) */
var HR_URL = location.origin + '/hr/'; /* build ໃນ apps/hr (deploy ຂຶ້ນ stdev.store/hr/) */ /* ST HR (ແອັບແຍກ) — ເປີດດ້ວຍ ?server=<api>/hr ໃຫ້ເຊື່ອມ server ຂອງບໍລິສັດ */
(function () { var m = /[?&]erpurl=([^&#]+)/.exec(location.search), u = m && decodeURIComponent(m[1]); if (u && /^https:\/\/[^\/?#]+\/|^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i.test(u)) ERP_URL = u; })(); /* ໃຊ້ທົດສອບ */
(function () { var m = /[?&]hrurl=([^&#]+)/.exec(location.search), u = m && decodeURIComponent(m[1]); if (u && /^https:\/\/[^\/?#]+\/|^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//i.test(u)) HR_URL = u; })(); /* ໃຊ້ທົດສອບ */
var CATALOG = {
 'stpos-fnb':     {name:'ຮ້ານອາຫານ / ຄາເຟ',  icon:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 2-3 5-3 8h3v10"/>', desc:'POS ຮ້ານອາຫານ ແລະ ຄາເຟ', kind:'pos'},
 'stpos-medical': {name:'ຄລີນິກ',             icon:'<path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7z"/>', desc:'ຄິວ ນັດໝາຍ ໃບສັ່ງຢາ', kind:'pos'},
 'stpos-mart':    {name:'ຮ້ານຂາຍຍ່ອຍ / ມາດ',  icon:'<path d="M3 4h2l2.4 11h10.2l2-8H6"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>', desc:'ສິນຄ້າ ບາໂຄດ ສະຕ໋ອກ', kind:'pos'},
 'stpos-hotel':   {name:'ໂຮງແຮມ / ທີ່ພັກ',    icon:'<path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="1.6"/>', desc:'ຫ້ອງພັກ ການຈອງ', kind:'pos'},
 'stpos-jewelry': {name:'ຮ້ານເຄື່ອງປະດັບ',    icon:'<path d="M6 3h12l3 5-9 13L3 8z"/><path d="M3 8h18M9 3l-2 5 5 13M15 3l2 5-5 13"/>', desc:'ທອງ ເງິນ ເພັດ ໃບຢັ້ງຢືນ', kind:'pos'},
 'sthr':          {name:'ST HR ພະນັກງານ',   icon:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.9.1 5 2.3 5 5.3"/>', desc:'ລົງເວລາ ລາ ເງິນເດືອນ', kind:'hr'},
 'laobooks':      {name:'LaoBooks ບັນຊີ',      icon:'<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11M9 8h6"/>', desc:'ບັນຊີ ອະນຸມັດ ຈັດຊື້', kind:'erp'}
};
var $ = function (i) { return document.getElementById(i); };
/* ເຊີບເວີ: ໂດເມນດຽວກັບໜ້ານີ້ (ທົດສອບໃນຄອມ: ?server=http://localhost:3000) */
function serverBase() {
 var m = /[?&]server=([^&#]+)/.exec(location.search), s = m ? decodeURIComponent(m[1]) : location.origin;
 return /^https:\/\/[^\/?#]+$|^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/i.test(s) ? s : location.origin;
}
function jsonp(url, cb) {
 var n = '_cb' + Date.now() + Math.floor(Math.random() * 1e4), sc = document.createElement('script'), done = false;
 var fin = function (r) { if (done) return; done = true; clearTimeout(t); delete window[n]; sc.remove(); cb(r); };
 var t = setTimeout(function () { fin(null); }, 12000); window[n] = fin; sc.onerror = function () { fin(null); };
 sc.src = url + (url.indexOf('?') < 0 ? '?' : '&') + 'callback=' + n; document.head.appendChild(sc);
}
function esc(x) { return String(x).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function show(co, api, erp) {
 ['s1', 'sL', 'sS', 'sC', 'sM'].forEach(function (x) { $(x).classList.add('hide'); }); $('s2').classList.remove('hide'); $('supbtn').parentNode.classList.add('hide'); $('cn').textContent = co.name || co.code;
 var tiles = (co.apps || []).filter(function (a) { return CATALOG[a]; }).map(function (a) {
  var c = CATALOG[a], href = c.kind === 'erp' ? ERP_URL + '?erp=' + encodeURIComponent(erp) : c.kind === 'hr' ? HR_URL + '?server=' + encodeURIComponent(api + '/hr') : 'index.html?api=' + encodeURIComponent(api);
  return '<a class="app" data-app="' + esc(a) + '" href="' + esc(href) + '"><span class="i" aria-hidden="true"><svg viewBox="0 0 24 24">' + c.icon + '</svg></span><b>' + esc(c.name) + '</b><span class="d">' + esc(c.desc) + '</span></a>';
 });
 $('aerr').textContent = ''; $('mstaff').classList.toggle('hide', !SUP); $('lout').classList.toggle('hide', !signedHere());
 $('apps').innerHTML = tiles.length ? tiles.join('') : '<div class="card">ບໍລິສັດນີ້ຍັງບໍ່ໄດ້ເປີດໃຊ້ແອັບ — ຕິດຕໍ່ຜູ້ດູແລລະບົບ</div>';
}
function lookup(code, auto) {
 $('err').textContent = ''; $('go').disabled = true;
 var b = serverBase(), api = b + '/api/t/' + code;
 jsonp(api + '/?login=company', function (r) {
  $('go').disabled = false;
  if (!r || !r.ok || !r.company) { if (!auto) $('err').textContent = r ? 'ບໍ່ພົບລະຫັດບໍລິສັດນີ້' : 'ເຊື່ອມຕໍ່ server ບໍ່ໄດ້ — ກວດອິນເຕີເນັດ ແລ້ວລອງໃໝ່'; try { if (auto) localStorage.removeItem('st_company'); } catch (e) {} return; }
  try { localStorage.setItem('st_company', code); } catch (e) {}
  CO = { co: r.company, api: api }; show(r.company, api, api + '/erp');
 });
}
$('f').onsubmit = function (e) { e.preventDefault(); var c = $('code').value.trim().toLowerCase(); if (!/^[a-z0-9][a-z0-9_-]{1,31}$/.test(c)) { $('err').textContent = 'ລະຫັດບໍລິສັດມີສະເພາະ a-z, 0-9, - _'; return; } lookup(c, false); };
$('chg').onclick = function () { if (SUP) { supList(); return; } $('supbtn').parentNode.classList.remove('hide'); try { localStorage.removeItem('st_company'); } catch (e) {} $('s2').classList.add('hide'); $('s1').classList.remove('hide'); $('code').focus(); };
/* ===== ບັນຊີດຽວທຸກແອັບ: ຊື່ + PIN ຄັ້ງດຽວ → POS, HR, ERP ຂອງບໍລິສັດນັ້ນ ເຂົ້າໄດ້ເລີຍ ===== */
var CO = null;
function ls(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function setHR(api, hr) {
 try {
  ['sthr-sheets-info', 'sthr-sheets-logins'].forEach(function (k) { localStorage.removeItem(k); });
  localStorage.setItem('sthr-server', JSON.stringify({ kind: 'sheets', url: api + '/hr', key: '' }));
  localStorage.setItem('sthr-sheets-token', hr.token); localStorage.setItem('sthr-sheets-me', JSON.stringify({ member: hr.member, company: hr.company })); localStorage.setItem('sthr-online', hr.member.companyId);
 } catch (e) {}
}
function setSession(code, api, tk, uid) {
 try { localStorage.setItem('st_company', code); localStorage.setItem('st_tk_co', code); localStorage.setItem('stpos_token', tk); localStorage.setItem('stpos_uid', uid); sessionStorage.setItem('erp_url', api + '/erp'); sessionStorage.setItem('erp_tk', tk); } catch (e) {}
}
function signOut() {
 try { ['st_tk_co', 'st_apps', 'stpos_token', 'stpos_uid', 'sthr-sheets-token', 'sthr-sheets-me', 'sthr-online'].forEach(function (k) { localStorage.removeItem(k); }); sessionStorage.removeItem('erp_tk'); } catch (e) {}
}
function askLogin() {
 only('sL'); $('lco').textContent = CO.co.name || CO.co.code; $('lerr').textContent = ''; $('lu').innerHTML = '<option>ກຳລັງໂຫຼດ…</option>';
 jsonp(CO.api + '/?login=info', function (r) {
  if (!r || !r.ok) { $('lerr').textContent = 'ເຊື່ອມຕໍ່ server ບໍ່ໄດ້'; return; }
  $('lu').innerHTML = (r.users || []).map(function (u) { return '<option value="' + esc(u.id) + '">' + esc(u.name || u.id) + '</option>'; }).join('') || '<option value="">ບໍ່ມີຜູ້ໃຊ້</option>';
  try { var last = localStorage.getItem('stpos_uid'); if (last && $('lu').querySelector('option[value="' + last.replace(/"/g, '') + '"]')) $('lu').value = last; } catch (e) {}
  $('lp').focus();
 });
}
$('lf').onsubmit = function (e) {
 e.preventDefault(); $('lerr').textContent = ''; $('lgo').disabled = true;
 var code = CO.co.code, api = CO.api, uid = $('lu').value;
 jsonp(api + '/?login=pin&uid=' + encodeURIComponent(uid) + '&pin=' + encodeURIComponent($('lp').value), function (r) {
  $('lp').value = '';
  if (!r || !r.ok || !r.tk) { $('lgo').disabled = false; $('lerr').textContent = !r ? 'ເຊື່ອມຕໍ່ server ບໍ່ໄດ້' : r.err === 'locked' ? (r.msg || 'ລັອກຊົ່ວຄາວ') : 'PIN ບໍ່ຖືກ' + (r.left != null ? ' (ເຫຼືອ ' + r.left + ' ເທື່ອ)' : ''); return; }
  setSession(code, api, r.tk, r.uid); try { localStorage.setItem('st_apps', JSON.stringify(r.apps || null)); } catch (e) {}
  var fin = function () { $('lgo').disabled = false; var p = PEND; PEND = null; if (p && allowed(p.app)) { location.href = p.href; return; } show(CO.co, api, api + '/erp'); if (p) $('aerr').textContent = 'ເຈົ້າຍັງບໍ່ມີສິດເຂົ້າແອັບນີ້ — ຂໍໃຫ້ Super admin ເປີດໃຫ້'; };
  if ((CO.co.apps || []).some(function (a) { return CATALOG[a] && CATALOG[a].kind === 'hr'; }) && allowed('sthr')) jsonp(api + '/?login=hr&tk=' + encodeURIComponent(r.tk), function (h) { if (h && h.ok && h.hr) setHR(api, h.hr); fin(); }); else fin();
 });
};
$('lback').onclick = function () { PEND = null; show(CO.co, CO.api, CO.api + '/erp'); };
$('lout').onclick = function () { signOut(); if (SUP) { supList(); return; } if (CO) askLogin(); else only('s1'); };
/* ===== ກົດແອັບ: ຍັງບໍ່ເຂົ້າລະບົບ → ເລືອກຊື່ + PIN ກ່ອນ · ບໍ່ມີສິດແອັບນີ້ → ບອກ (server ກໍກວດຊ້ຳ) ===== */
var PEND = null;
function signedHere() { return !!CO && ls('st_tk_co') === CO.co.code && !!ls('stpos_token'); }
function myApps() { try { return JSON.parse(ls('st_apps') || 'null'); } catch (e) { return null; } }
function allowed(a) { var m = myApps(); return !m || m.indexOf(a) >= 0; }
$('apps').onclick = function (e) {
 var t = e.target.closest('a[data-app]'); if (!t) return;
 if (!signedHere()) { e.preventDefault(); PEND = { app: t.dataset.app, href: t.getAttribute('href') }; askLogin(); return; }
 if (!allowed(t.dataset.app)) { e.preventDefault(); $('aerr').textContent = 'ເຈົ້າຍັງບໍ່ມີສິດເຂົ້າແອັບນີ້ — ຂໍໃຫ້ Super admin ເປີດໃຫ້'; }
};
/* ===== Super admin: ຈັດການພະນັກງານ (ເພີ່ມ, PIN, ແອັບທີ່ເຂົ້າໄດ້) ===== */
function appBoxes(apps, sel) { return apps.filter(function (a) { return CATALOG[a]; }).map(function (a) { return '<label><input type="checkbox" value="' + esc(a) + '"' + (!sel || sel.indexOf(a) >= 0 ? ' checked' : '') + '> ' + esc(CATALOG[a].name) + '</label>'; }).join(''); }
function ticked(box) { return Array.prototype.map.call(box.querySelectorAll('input[type=checkbox]:checked'), function (c) { return c.value; }); }
var ROLE = { superadmin: 'Super admin', owner: 'ເຈົ້າຂອງ', admin: 'Admin', manager: 'ຜູ້ຈັດການ', accountant: 'ບັນຊີ', cashier: 'ພະນັກງານ', waiter: 'ພະນັກງານເສີບ' };
function staffLoad() {
 only('sM'); $('mco').textContent = CO.co.name || CO.co.code; $('mlist').innerHTML = '<div class="card">ກຳລັງໂຫຼດ…</div>';
 sapi('staff_list', { stk: SUP, code: CO.co.code }).then(function (r) {
  if (!r.ok) { $('mlist').innerHTML = '<div class="card err">ໂຫຼດບໍ່ໄດ້ (' + esc(r.err || '') + ')</div>'; return; }
  STAFF_APPS = r.apps; $('mapps').innerHTML = appBoxes(r.apps, null);
  $('mlist').innerHTML = r.staff.map(function (u) {
   var boss = u.role === 'superadmin' || u.role === 'owner';
   return '<div class="card srow" data-id="' + esc(u.id) + '"><div class="top"><b>' + esc(u.name) + '</b><small>' + esc(ROLE[u.role] || u.role) + (u.active ? '' : ' · ປິດ') + '</small></div>' +
    (boss ? '<small>ເຂົ້າໄດ້ທຸກແອັບ (ເຈົ້າຂອງ)</small>' : '<label>ເຂົ້າແອັບໄດ້</label><div class="apps">' + appBoxes(r.apps, u.apps) + '</div>') +
    '<div class="pinrow"><input type="password" inputmode="numeric" maxlength="8" autocomplete="new-password" placeholder="PIN ໃໝ່ (ຖ້າຈະປ່ຽນ)"></div>' +
    '<button class="g" type="button">ບັນທຶກ</button> <span class="m"></span></div>';
  }).join('');
 }).catch(function () { $('mlist').innerHTML = '<div class="card err">ເຊື່ອມຕໍ່ server ບໍ່ໄດ້</div>'; });
}
var STAFF_APPS = [];
var ERR = { pin: 'PIN ຕ້ອງເປັນຕົວເລກ 4-8 ຫຼັກ', pin_taken: 'PIN ນີ້ມີຄົນໃຊ້ແລ້ວ', name_taken: 'ຊື່ນີ້ມີແລ້ວ', need: 'ໃສ່ຊື່ ແລະ PIN', stk: 'ໝົດເວລາ — ເຂົ້າ Super admin ໃໝ່' };
$('mstaff').onclick = staffLoad;
$('mback').onclick = function () { show(CO.co, CO.api, CO.api + '/erp'); };
$('madd').onclick = function () {
 $('merr').className = 'err'; $('merr').textContent = '';
 sapi('staff_save', { stk: SUP, code: CO.co.code, name: $('mn').value.trim(), pin: $('mp').value, apps: ticked($('mapps')) }).then(function (r) {
  $('mp').value = ''; if (!r.ok) { $('merr').textContent = ERR[r.err] || ('ບໍ່ສຳເລັດ: ' + r.err); return; }
  $('mn').value = ''; staffLoad(); $('merr').className = 'msg-ok'; $('merr').textContent = 'ເພີ່ມແລ້ວ ✓';
 });
};
$('mlist').onclick = function (e) {
 var b = e.target.closest('button'), row = e.target.closest('.srow'); if (!b || !row) return;
 var box = row.querySelector('.apps'), pin = row.querySelector('.pinrow input'), m = row.querySelector('.m'), body = { stk: SUP, code: CO.co.code, id: row.dataset.id, pin: pin.value };
 if (box) body.apps = ticked(box);
 sapi('staff_save', body).then(function (r) { pin.value = ''; m.className = r.ok ? 'm msg-ok' : 'm err'; m.textContent = r.ok ? 'ບັນທຶກແລ້ວ ✓' : (ERR[r.err] || ('ບໍ່ສຳເລັດ: ' + r.err)); });
};
/* ===== Super admin (ເຈົ້າຂອງແພລດຟອມ): PIN ດຽວ → ເລືອກບໍລິສັດ → ກົດແອັບ ເຂົ້າເລີຍ ===== */
var SUP = null; try { SUP = localStorage.getItem('st_super'); } catch (e) {}
function sapi(a, body) { return fetch(serverBase() + '/api/?super=' + a, { method: 'POST', body: JSON.stringify(body || {}) }).then(function (r) { return r.json(); }); }
function only(id) { ['s1', 's2', 'sS', 'sC', 'sL', 'sM'].forEach(function (x) { $(x).classList.toggle('hide', x !== id); }); $('supbtn').parentNode.classList.toggle('hide', id !== 's1'); }
function supOut() { SUP = null; try { localStorage.removeItem('st_super'); } catch (e) {} only('s1'); }
function supList() {
 only('sC'); $('cerr').textContent = ''; $('clist').innerHTML = '<div class="card">ກຳລັງໂຫຼດ…</div>';
 sapi('list', { stk: SUP }).then(function (r) {
  if (!r.ok) { if (r.err === 'stk') { supOut(); only('sS'); $('serr').textContent = 'ໝົດເວລາ — ໃສ່ PIN ໃໝ່'; } else $('cerr').textContent = 'ໂຫຼດບໍ່ໄດ້'; return; }
  $('clist').innerHTML = r.companies.length ? r.companies.map(function (c) { return '<a class="app" href="#" data-c="' + esc(c.code) + '"><b>' + esc(c.name) + '</b><span class="d">' + esc(c.code) + ' · ' + (c.apps || []).filter(function (a) { return CATALOG[a]; }).map(function (a) { return CATALOG[a].name; }).join(', ') + '</span></a>'; }).join('') : '<div class="card">ຍັງບໍ່ມີບໍລິສັດ</div>';
 }).catch(function () { $('cerr').textContent = 'ເຊື່ອມຕໍ່ server ບໍ່ໄດ້'; });
}
function supEnter(code) {
 $('cerr').textContent = '';
 sapi('enter', { stk: SUP, code: code }).then(function (r) {
  if (!r.ok) { if (r.err === 'stk') { supOut(); only('sS'); } else $('cerr').textContent = 'ເຂົ້າບໍລິສັດນີ້ບໍ່ໄດ້'; return; }
  var api = serverBase() + '/api/t/' + code; CO = { co: r.company, api: api };
  if (r.pos) setSession(code, api, r.pos.tk, r.pos.uid); try { localStorage.setItem('st_apps', 'null'); } catch (e) {}
  if (r.hr) setHR(api, r.hr);
  show(r.company, api, api + '/erp');
 }).catch(function () { $('cerr').textContent = 'ເຊື່ອມຕໍ່ server ບໍ່ໄດ້'; });
}
$('supbtn').onclick = function () { if (SUP) supList(); else { only('sS'); $('spin').focus(); } };
$('sout').onclick = supOut;
$('clist').onclick = function (e) { var a = e.target.closest('a[data-c]'); if (a) { e.preventDefault(); supEnter(a.dataset.c); } };
$('sf').onsubmit = function (e) {
 e.preventDefault(); $('serr').textContent = ''; $('sgo').disabled = true;
 sapi('login', { pin: $('spin').value }).then(function (r) {
  $('sgo').disabled = false; $('spin').value = '';
  if (r.ok) { SUP = r.stk; try { localStorage.setItem('st_super', SUP); } catch (e) {} supList(); }
  else $('serr').textContent = r.err === 'notset' ? 'ຍັງບໍ່ໄດ້ຕັ້ງ PIN Super admin — ຕັ້ງໃນໜ້າຜູ້ດູແລລະບົບ' : r.err === 'locked' ? 'ໃສ່ຜິດຫຼາຍເທື່ອ — ລໍ 15 ນາທີ' : 'PIN ບໍ່ຖືກ' + (r.left != null ? ' (ເຫຼືອ ' + r.left + ' ເທື່ອ)' : '');
 }).catch(function () { $('sgo').disabled = false; $('serr').textContent = 'ເຊື່ອມຕໍ່ server ບໍ່ໄດ້'; });
};
(function () { var q = /[?&]code=([a-z0-9_-]+)/i.exec(location.search), c = q && q[1].toLowerCase(); if (!c) try { c = localStorage.getItem('st_company'); } catch (e) {} if (q) { $('code').value = c; lookup(c, true); return; }
 sapi('home', {}).then(function (h) { if (h.ok) { $('code').value = h.company.code; lookup(h.company.code, true); } else if (SUP) supList(); else if (c) { $('code').value = c; lookup(c, true); } }).catch(function () { if (c) { $('code').value = c; lookup(c, true); } });
})();
</script>
